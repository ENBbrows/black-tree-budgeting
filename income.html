<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Income Tracker — Black Tree</title>
<link rel="manifest" href="manifest-income.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BT Income">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css" />
</head>
<body>
<div class="bt-header bt-header--row">
  <div class="bt-brand">
    <img src="assets/emblem-gold.png" alt="" class="bt-emblem">
    <div class="bt-wordmark-stack">
      <img src="assets/wordmark-top-gold.png" alt="Black Tree" class="bt-wordmark-title">
      <img src="assets/wordmark-bottom-gold.png" alt="Investments" class="bt-wordmark-sub">
    </div>
  </div>
  <a href="dashboard.html" class="bt-btn bt-btn--ghost bt-btn--sm" style="text-decoration:none">← Dashboard</a>
</div>

<div class="bt-container">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px">
    <h1>Income Tracker</h1>
    <span id="bt-net-badge" class="bt-badge bt-badge--online">Online</span>
  </div>
  <p class="bt-sub">Log income as you receive it. Saves instantly, even with no signal.</p>

  <div class="bt-card">
    <label for="f-source" data-tip="What this money is from — your job, a side hustle, rental income, whatever fits. Type anything, or pick a suggestion.">Income source</label>
    <input id="f-source" type="text" list="source-suggestions" placeholder="e.g. Salary / Primary Job" />
    <datalist id="source-suggestions"></datalist>

    <div id="biz-income-fields" style="display:none">
      <label data-tip="Which revenue stream this payment belongs to, for your Profit &amp; Loss.">Category</label>
      <div class="bt-chip-row" id="f-category-chips"></div>
      <label data-tip="Was VAT charged on this sale? Pick the treatment, then confirm the VAT portion of the amount above — suggested automatically at your account's VAT rate for a standard-rated sale.">VAT treatment</label>
      <div class="bt-chip-row" id="f-vat-chips"></div>
      <div class="bt-field-row">
        <div><label data-tip="The VAT portion of the amount above (not an extra charge on top) — only relevant for a standard-rated sale.">VAT amount</label><input id="f-vat-amount" type="number" min="0" step="0.01" placeholder="0.00" /></div>
        <div>
          <label for="f-project" data-tip="Optional — tag this to a specific contract/job to see its own profitability on the Books page.">Project <span style="font-weight:400;color:var(--bt-muted)">(optional)</span></label>
          <select id="f-project"><option value="">— none —</option></select>
        </div>
      </div>
    </div>

    <div class="bt-field-row">
      <div>
        <label for="f-amount" data-tip="The amount you actually received, e.g. 8000.00, in whichever currency you were paid in.">Amount</label>
        <input id="f-amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" />
      </div>
      <div>
        <label for="f-currency" data-tip="Pick the currency this payment was actually in. Different sources can use different currencies — e.g. a local salary in TTD alongside USD freelance income. Set an exchange rate in Dashboard → Settings to see it all converted together.">Currency</label>
        <select id="f-currency"></select>
      </div>
    </div>

    <div class="bt-field-row">
      <div>
        <label for="f-frequency" data-tip="How often this source usually comes in. Examples: your salary is Monthly, a side gig might be Weekly or One-time. Just for reference — it doesn't change your Dashboard numbers.">Frequency</label>
        <select id="f-frequency"></select>
      </div>
      <div>
        <label for="f-date" data-tip="The date you got paid. Defaults to today.">Date received</label>
        <input id="f-date" type="date" />
      </div>
    </div>

    <label for="f-notes" data-tip="Anything extra worth remembering. Examples: &quot;Year-end bonus&quot;, &quot;First half of contract payment&quot;. Totally optional.">Notes <span style="font-weight:400;color:var(--bt-muted)">(optional)</span></label>
    <input id="f-notes" type="text" placeholder="" />

    <div class="bt-field-row">
      <div>
        <label for="f-payment-type" data-tip="How this money reached you — cash, deposited to a card/account, cheque, etc. Lets Black Tree track where your money actually comes in, not just its source.">Received via <span style="font-weight:400;color:var(--bt-muted)">(optional)</span></label>
        <select id="f-payment-type"><option value="">— not specified —</option></select>
      </div>
      <div>
        <label for="f-payment-account" data-tip="Optional — which account it landed in, e.g. &quot;Republic Chequing&quot;. Type a new one or pick one you've used before.">Account <span style="font-weight:400;color:var(--bt-muted)">(optional)</span></label>
        <input id="f-payment-account" type="text" list="payment-account-suggestions" placeholder="e.g. Republic Chequing" />
        <datalist id="payment-account-suggestions"></datalist>
      </div>
    </div>

    <label for="lib-file">Attach bank transfer screenshot <span style="font-weight:400;color:var(--bt-muted)">(optional — saved to your private Document Library)</span></label>
    <input id="lib-file" type="file" accept="image/*" capture="environment" />

    <button class="bt-btn bt-btn--gold" id="f-submit" style="margin-top:18px">Save income</button>
  </div>

  <h2>Recent entries</h2>
  <div class="bt-card" id="bt-recent"><div class="bt-empty">Nothing logged yet.</div></div>
</div>

<div class="bt-toast" id="bt-toast"></div>

<button type="button" class="bt-fab" id="scan-fab-btn" title="Scan a bill" aria-label="Scan a bill">📷</button>
<input type="file" id="scan-fab-file" accept="image/*" capture="environment" style="display:none" />

<nav class="bt-bottom-nav">
  <a href="income.html" class="active">Income</a>
  <a href="expense.html">Expense</a>
  <a href="library.html">Library</a>
  <a href="dashboard.html">Dashboard</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="store.js"></script>
<script src="tips.js"></script>
<script>
  let btUid = null;

  function isBusinessNow() {
    return btIsBusinessAccount(btLoadStore(btUid).profile);
  }

  function renderCategoryChips() {
    const wrap = document.getElementById("f-category-chips");
    const current = wrap.querySelector(".bt-chip--selected")?.dataset.value;
    wrap.innerHTML = BT_CONFIG.BUSINESS_INCOME_CATEGORIES.map((c) =>
      `<button type="button" class="bt-chip${c === current ? " bt-chip--selected" : ""}" data-value="${btEscapeHtml(c)}">${btEscapeHtml(c)}</button>`
    ).join("");
    wrap.querySelectorAll(".bt-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        wrap.querySelectorAll(".bt-chip").forEach((c) => c.classList.remove("bt-chip--selected"));
        chip.classList.add("bt-chip--selected");
      });
    });
  }

  function renderVatChips() {
    const wrap = document.getElementById("f-vat-chips");
    const current = wrap.querySelector(".bt-chip--selected")?.dataset.value || "standard_rated";
    wrap.innerHTML = BT_CONFIG.VAT_TREATMENTS.map((t) =>
      `<button type="button" class="bt-chip${t.value === current ? " bt-chip--selected" : ""}" data-value="${t.value}">${t.label}</button>`
    ).join("");
    wrap.querySelectorAll(".bt-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        wrap.querySelectorAll(".bt-chip").forEach((c) => c.classList.remove("bt-chip--selected"));
        chip.classList.add("bt-chip--selected");
        suggestVatAmount();
      });
    });
  }

  /** Suggests the VAT portion of the amount entered (amount is gross/VAT-inclusive) at the account's own VAT rate — only when the field's still at its last suggestion, so it never overwrites a figure the client typed themselves. */
  function suggestVatAmount() {
    const treatment = document.querySelector("#f-vat-chips .bt-chip--selected")?.dataset.value;
    const vatInput = document.getElementById("f-vat-amount");
    if (treatment !== "standard_rated") { vatInput.value = ""; vatInput.dataset.suggested = ""; return; }
    if (vatInput.value && vatInput.value !== vatInput.dataset.suggested) return;
    const amount = parseFloat(document.getElementById("f-amount").value) || 0;
    const rate = Number(btLoadStore(btUid).profile?.vat_rate ?? BT_CONFIG.DEFAULT_VAT_RATE);
    const suggested = amount > 0 ? (amount * rate / (100 + rate)).toFixed(2) : "";
    vatInput.value = suggested;
    vatInput.dataset.suggested = suggested;
  }

  function populateProjectOptions() {
    const sel = document.getElementById("f-project");
    const store = btLoadStore(btUid);
    const current = sel.value;
    const currentLabel = sel.options[sel.selectedIndex]?.textContent;
    const active = store.projects.filter((p) => p.status === "active");
    sel.innerHTML = '<option value="">— none —</option>' +
      active.map((p) => `<option value="${p.id}">${btEscapeHtml(p.name)}</option>`).join("") +
      '<option value="__new__">+ New project…</option>';
    if (active.some((p) => p.id === current)) {
      sel.value = current;
    } else if (current && current !== "__new__") {
      // A just-created project's temp id can be replaced by the server's
      // real one mid-edit (a background sync lands while the form is
      // still open) — re-match by name instead of silently losing the
      // selection the client just made.
      const match = active.find((p) => p.name === currentLabel);
      if (match) sel.value = match.id;
    }
  }

  function applyAccountTypeUI() {
    const isBiz = isBusinessNow();
    document.getElementById("biz-income-fields").style.display = isBiz ? "" : "none";
    if (isBiz) { renderCategoryChips(); renderVatChips(); populateProjectOptions(); }
  }

  function toast(msg) {
    const el = document.getElementById("bt-toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 2600);
  }

  function updateNetBadge() {
    const el = document.getElementById("bt-net-badge");
    if (navigator.onLine) { el.textContent = "Online"; el.className = "bt-badge bt-badge--online"; }
    else { el.textContent = "Offline — saving locally"; el.className = "bt-badge bt-badge--offline"; }
  }
  window.addEventListener("online", updateNetBadge);
  window.addEventListener("offline", updateNetBadge);

  function fmtMoney(n, cur) {
    return cur + " " + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderRecent() {
    const store = btLoadStore(btUid);
    const home = store.profile?.currency || "TTD";
    const wrap = document.getElementById("bt-recent");
    const rows = [...store.income].sort((a, b) => (b.entry_date + b.created_at).localeCompare(a.entry_date + a.created_at)).slice(0, 8);
    if (!rows.length) { wrap.innerHTML = '<div class="bt-empty">Nothing logged yet.</div>'; return; }
    wrap.innerHTML = rows.map((r) => {
      const via = r.payment_type ? btEscapeHtml(r.payment_type) + (r.payment_account ? " · " + btEscapeHtml(r.payment_account) : "") : "";
      return `
      <div class="bt-list-row">
        <div>
          <div>${btEscapeHtml(r.source)}${r._pending ? '<span class="bt-pending-dot" title="Syncing"></span>' : ""}</div>
          <div class="meta">${r.frequency} · ${r.entry_date}${via ? " · " + via : ""}</div>
        </div>
        <div class="amt">${fmtMoney(r.amount, r.currency || home)}</div>
      </div>
    `;
    }).join("");
  }

  function paymentAccountSuggestions(store) {
    const names = new Set();
    [...store.income, ...store.expenses].forEach((e) => { if (e.payment_account) names.add(e.payment_account); });
    return [...names];
  }

  function refreshPaymentAccountSuggestions() {
    const store = btLoadStore(btUid);
    document.getElementById("payment-account-suggestions").innerHTML =
      paymentAccountSuggestions(store).map((n) => `<option value="${n}">`).join("");
  }

  async function init() {
    const user = await btRequireAuth();
    if (!user) return;
    btUid = window.btCurrentUserId = user.id;

    document.getElementById("f-date").value = new Date().toISOString().slice(0, 10);
    const freqSel = document.getElementById("f-frequency");
    freqSel.innerHTML = BT_CONFIG.INCOME_FREQUENCIES.map((f) => `<option value="${f}">${f}</option>`).join("");
    document.getElementById("source-suggestions").innerHTML = BT_CONFIG.INCOME_SOURCE_SUGGESTIONS.map((s) => `<option value="${s}">`).join("");

    const profile = await btGetOrLoadProfile(btUid);
    const currencySel = document.getElementById("f-currency");
    currencySel.innerHTML = btCurrencyOptions(profile).map((c) => `<option value="${c}">${c}</option>`).join("");

    const paymentSel = document.getElementById("f-payment-type");
    paymentSel.innerHTML = '<option value="">— not specified —</option>' + BT_CONFIG.PAYMENT_TYPES.map((p) => `<option value="${p}">${p}</option>`).join("");
    const lastPaymentType = localStorage.getItem("bt_last_income_payment_type");
    if (lastPaymentType && BT_CONFIG.PAYMENT_TYPES.includes(lastPaymentType)) paymentSel.value = lastPaymentType;
    refreshPaymentAccountSuggestions();

    updateNetBadge();
    renderRecent();
    applyAccountTypeUI();
    document.getElementById("f-amount").addEventListener("input", suggestVatAmount);
    document.getElementById("f-project").addEventListener("change", async (e) => {
      if (e.target.value !== "__new__") return;
      const name = prompt("Project / contract name:");
      if (!name || !name.trim()) { e.target.value = ""; return; }
      const tempId = btAddProject(btUid, { name: name.trim(), status: "active" });
      populateProjectOptions();
      e.target.value = tempId;
      // Resolve the temp id to its real server one right away, while
      // online, so the form never submits an id nothing points at yet —
      // offline, it stays queued and the sync engine's own idMap
      // chaining resolves it once the project and whatever references
      // it eventually sync together.
      if (navigator.onLine) { await btSync(btUid); populateProjectOptions(); }
    });
    btSync(btUid).then(() => { renderRecent(); refreshPaymentAccountSuggestions(); applyAccountTypeUI(); });
    btWireScanFab("scan-fab-btn", "scan-fab-file");

    document.getElementById("f-submit").addEventListener("click", () => {
      const source = document.getElementById("f-source").value.trim();
      const amount = parseFloat(document.getElementById("f-amount").value);
      const currency = currencySel.value;
      const frequency = freqSel.value;
      const entry_date = document.getElementById("f-date").value;
      const notes = document.getElementById("f-notes").value.trim() || null;
      const payment_type = paymentSel.value || null;
      const payment_account = document.getElementById("f-payment-account").value.trim() || null;
      const isBiz = isBusinessNow();
      const category = document.querySelector("#f-category-chips .bt-chip--selected")?.dataset.value || null;

      if (!source) return toast("Enter an income source.");
      if (!amount || amount <= 0) return toast("Enter a valid amount.");
      if (!entry_date) return toast("Pick a date.");
      if (isBiz && !category) return toast("Pick a revenue category.");

      const payload = { source, amount, currency, frequency, entry_date, notes, payment_type, payment_account };
      if (isBiz) {
        payload.category = category;
        const vatTreatment = document.querySelector("#f-vat-chips .bt-chip--selected")?.dataset.value || null;
        const vatAmountVal = parseFloat(document.getElementById("f-vat-amount").value);
        payload.vat_treatment = vatTreatment;
        payload.vat_amount = vatTreatment === "standard_rated" && vatAmountVal >= 0 ? vatAmountVal : null;
        payload.project_id = document.getElementById("f-project").value || null;
      }
      btAddIncome(btUid, payload);
      renderRecent();
      refreshPaymentAccountSuggestions();
      toast(navigator.onLine ? "Income saved" : "Saved offline — will sync automatically");

      if (payment_type) localStorage.setItem("bt_last_income_payment_type", payment_type);

      const libFile = document.getElementById("lib-file").files[0];
      if (libFile) {
        if (navigator.onLine) {
          btUploadDocument(btUid, libFile, {
            doc_type: "bank_transfer", bank_name: payment_account, category: null,
            amount, doc_date: entry_date, notes: source, income_id: null, expense_id: null
          }).then(() => toast("Screenshot saved to Document Library"))
            .catch(() => toast("Income saved, but the screenshot didn't upload — try adding it from the Document Library."));
        } else {
          toast("Income saved offline — attach the screenshot from the Document Library once you're back online.");
        }
      }

      document.getElementById("f-source").value = "";
      document.getElementById("f-amount").value = "";
      document.getElementById("f-notes").value = "";
      document.getElementById("f-payment-account").value = "";
      document.getElementById("lib-file").value = "";
      if (isBiz) {
        document.getElementById("f-vat-amount").value = "";
        document.getElementById("f-vat-amount").dataset.suggested = "";
        document.getElementById("f-project").value = "";
        document.querySelectorAll("#f-category-chips .bt-chip").forEach((c) => c.classList.remove("bt-chip--selected"));
      }
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
      // A new service worker taking over means fresh HTML/JS is available —
      // reload once to pick it up, so an already-open tab or installed PWA
      // icon doesn't keep running old code indefinitely. sessionStorage
      // (not a plain JS variable) survives the reload itself, and the
      // timestamp check stops a same-instant double-fire from reloading
      // twice while still allowing a genuinely new update later in the
      // same session to reload again.
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        let last = 0;
        try { last = parseInt(sessionStorage.getItem("bt_sw_reload_ts") || "0", 10); } catch (e) {}
        if (Date.now() - last < 5000) return;
        try { sessionStorage.setItem("bt_sw_reload_ts", String(Date.now())); } catch (e) {}
        window.location.reload();
      });
    }
  }
  init();
</script>
</body>
</html>
