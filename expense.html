<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expense Tracker — Black Tree</title>
<link rel="manifest" href="manifest-expense.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BT Expense">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF7F2">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css" />
<style>
  #scan-status { font-size: 0.82rem; color: var(--bt-muted); margin: 8px 0 0; display: none; }
  #scan-status.show { display: block; }
  #category-hint { font-size: 0.76rem; color: var(--bt-gold); margin: -12px 0 12px; display: none; }
  #category-hint.show { display: block; }
</style>
</head>
<body>
<div class="bt-header">
  <img src="assets/wordmark-gold.png" alt="Black Tree Investments" style="height:28px">
</div>

<div class="bt-container">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px">
    <h1>Expense Tracker</h1>
    <span id="bt-net-badge" class="bt-badge bt-badge--online">Online</span>
  </div>
  <p class="bt-sub">Say what it was and how much — we'll sort out the category. Saves instantly, even with no signal.</p>

  <button class="bt-btn bt-btn--ghost" id="scan-btn" style="margin-bottom:16px">📷 Scan a bill or receipt</button>
  <input type="file" id="scan-file" accept="image/*" capture="environment" style="display:none" />
  <p id="scan-status"></p>

  <div class="bt-card">
    <label for="f-desc" data-tip="What was this for? Examples: &quot;Rent&quot;, &quot;KFC lunch&quot;, &quot;T&amp;TEC bill&quot;, &quot;Netflix&quot;. We'll guess the category from this.">What was it for?</label>
    <input id="f-desc" type="text" placeholder="e.g. Grocery run at Massy Stores" />

    <div class="bt-field-row">
      <div>
        <label for="f-amount" data-tip="How much you spent, e.g. 250.00.">Amount</label>
        <input id="f-amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" />
      </div>
      <div>
        <label for="f-date" data-tip="When you spent it. Defaults to today.">Date</label>
        <input id="f-date" type="date" />
      </div>
    </div>

    <label for="f-category" data-tip="What kind of spending this is — we guess this from what you typed above, but change it any time. Pick Debt Repayment or Savings & Investments if you want it to count toward a goal or debt below.">Category</label>
    <select id="f-category"></select>
    <p id="category-hint">Guessed from what you typed — change it if that's not right.</p>

    <div id="link-wrap" style="display:none">
      <label for="f-link" data-tip="Optional — pick a goal or debt to automatically add this amount to its progress.">Apply toward <span style="font-weight:400;color:var(--bt-muted)">(optional)</span></label>
      <select id="f-link"><option value="">— none —</option></select>
    </div>

    <button class="bt-btn bt-btn--gold" id="f-submit" style="margin-top:18px">Save expense</button>
  </div>

  <h2>Recent entries</h2>
  <div class="bt-card" id="bt-recent"><div class="bt-empty">Nothing logged yet.</div></div>
</div>

<div class="bt-toast" id="bt-toast"></div>

<nav class="bt-bottom-nav">
  <a href="income.html">Income</a>
  <a href="expense.html" class="active">Expense</a>
  <a href="dashboard.html">Dashboard</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="store.js"></script>
<script src="tips.js"></script>
<script>
  let btUid = null;
  let categoryManuallySet = false;

  function toast(msg) {
    const el = document.getElementById("bt-toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 2600);
  }

  function updateNetBadge() {
    const el = document.getElementById("bt-net-badge");
    if (navigator.onLine) { el.textContent = "Online"; el.className = "bt-badge bt-badge--online"; }
    else { el.textContent = "Offline — saving locally"; el.className = "bt-badge bt-badge--offline"; }
  }
  window.addEventListener("online", updateNetBadge);
  window.addEventListener("offline", updateNetBadge);

  function fmtMoney(n) {
    const store = btLoadStore(btUid);
    const currency = store.profile?.currency || "TTD";
    return currency + " " + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderRecent() {
    const store = btLoadStore(btUid);
    const wrap = document.getElementById("bt-recent");
    const rows = [...store.expenses].sort((a, b) => (b.expense_date + b.created_at).localeCompare(a.expense_date + a.created_at)).slice(0, 8);
    if (!rows.length) { wrap.innerHTML = '<div class="bt-empty">Nothing logged yet.</div>'; return; }
    wrap.innerHTML = rows.map((r) => `
      <div class="bt-list-row">
        <div>
          <div>${r.notes || r.category}${r._pending ? '<span class="bt-pending-dot" title="Syncing"></span>' : ""}</div>
          <div class="meta">${r.category} · ${r.expense_date}</div>
        </div>
        <div class="amt">${fmtMoney(r.amount)}</div>
      </div>
    `).join("");
  }

  function updateLinkOptions() {
    const category = document.getElementById("f-category").value;
    const linkWrap = document.getElementById("link-wrap");
    const linkSel = document.getElementById("f-link");
    const store = btLoadStore(btUid);

    if (category === BT_CONFIG.GOAL_LINK_CATEGORY && store.goals.length) {
      linkWrap.style.display = "";
      linkSel.innerHTML = '<option value="">— none —</option>' + store.goals.map((g) => `<option value="${g.id}">${g.description}</option>`).join("");
      linkSel.dataset.kind = "goal";
    } else if (category === BT_CONFIG.DEBT_LINK_CATEGORY && store.liabilities.length) {
      linkWrap.style.display = "";
      linkSel.innerHTML = '<option value="">— none —</option>' + store.liabilities.map((l) => `<option value="${l.id}">${l.debt_name}</option>`).join("");
      linkSel.dataset.kind = "liability";
    } else {
      linkWrap.style.display = "none";
      linkSel.value = "";
    }
  }

  function tryAutoGuessCategory() {
    const desc = document.getElementById("f-desc").value;
    if (!desc.trim()) { categoryManuallySet = false; document.getElementById("category-hint").classList.remove("show"); return; }
    if (categoryManuallySet) return;
    const guess = btGuessCategory(desc);
    if (guess) {
      document.getElementById("f-category").value = guess;
      document.getElementById("category-hint").classList.add("show");
      updateLinkOptions();
    }
  }

  let scanLib = null;
  async function loadScanLib() {
    if (scanLib) return scanLib;
    await new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
    scanLib = window.Tesseract;
    return scanLib;
  }

  async function handleScanFile(file) {
    const statusEl = document.getElementById("scan-status");
    statusEl.classList.add("show");
    statusEl.textContent = "Loading scanner…";
    try {
      const Tesseract = await loadScanLib();
      statusEl.textContent = "Reading bill… this can take a moment.";
      const { data } = await Tesseract.recognize(file, "eng", {
        logger: (m) => { if (m.status === "recognizing text") statusEl.textContent = `Reading bill… ${Math.round((m.progress || 0) * 100)}%`; }
      });
      const text = data.text || "";
      const amount = btGuessAmountFromText(text);
      const category = btGuessCategory(text);
      if (amount) document.getElementById("f-amount").value = amount.toFixed(2);
      if (category) {
        document.getElementById("f-category").value = category;
        categoryManuallySet = true; // trust the scan over further auto-guessing from the description field
        document.getElementById("category-hint").classList.add("show");
      }
      updateLinkOptions();
      statusEl.textContent = amount
        ? "Got it — double-check the amount and category below before saving."
        : "Couldn't find a clear total — fill in the amount yourself; category guess (if any) is below.";
    } catch (err) {
      console.error("Black Tree bill scan failed", err);
      statusEl.textContent = "Couldn't read that image — enter the details manually below.";
    }
  }

  async function init() {
    const user = await btRequireAuth();
    if (!user) return;
    btUid = window.btCurrentUserId = user.id;

    document.getElementById("f-date").value = new Date().toISOString().slice(0, 10);
    const catSel = document.getElementById("f-category");
    catSel.innerHTML = BT_CONFIG.EXPENSE_CATEGORIES.map((c) => `<option value="${c}">${c}</option>`).join("");
    catSel.addEventListener("change", () => { categoryManuallySet = true; document.getElementById("category-hint").classList.remove("show"); updateLinkOptions(); });

    document.getElementById("f-desc").addEventListener("input", tryAutoGuessCategory);

    document.getElementById("scan-btn").addEventListener("click", () => document.getElementById("scan-file").click());
    document.getElementById("scan-file").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) handleScanFile(file);
      e.target.value = "";
    });

    updateNetBadge();
    renderRecent();
    updateLinkOptions();
    btSync(btUid).then(() => { renderRecent(); updateLinkOptions(); });

    document.getElementById("f-submit").addEventListener("click", () => {
      const notes = document.getElementById("f-desc").value.trim() || null;
      const category = catSel.value;
      const amount = parseFloat(document.getElementById("f-amount").value);
      const expense_date = document.getElementById("f-date").value;
      const linkSel = document.getElementById("f-link");
      const linkId = linkSel.value || null;

      if (!notes) return toast("Say what this was for.");
      if (!amount || amount <= 0) return toast("Enter a valid amount.");
      if (!expense_date) return toast("Pick a date.");

      const payload = { category, amount, expense_date, notes, goal_id: null, liability_id: null };
      if (linkId && linkSel.dataset.kind === "goal") payload.goal_id = linkId;
      if (linkId && linkSel.dataset.kind === "liability") payload.liability_id = linkId;

      btAddExpense(btUid, payload);
      renderRecent();
      toast(navigator.onLine ? "Expense saved" : "Saved offline — will sync automatically");

      document.getElementById("f-desc").value = "";
      document.getElementById("f-amount").value = "";
      document.getElementById("scan-status").classList.remove("show");
      document.getElementById("category-hint").classList.remove("show");
      categoryManuallySet = false;
    });

    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  init();
</script>
</body>
</html>
